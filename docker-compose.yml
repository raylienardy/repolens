services:
  db:
    image: postgres:18-alpine
    container_name: repolens_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repolens_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repolens_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://repolens:repolens@db:5432/repolens
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      AI_PROVIDER: mock
      APP_ENV: production
      CORS_ORIGINS: "[\"http://localhost:3000\"]"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - repolens_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: repolens_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - repolens_network

volumes:
  postgres_data:

networks:
  repolens_network:
    driver: bridge
