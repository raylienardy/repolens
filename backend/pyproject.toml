[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-backend"
version = "0.1.0"
description = "Backend for RepoLens analysis tool"
authors = [{ name = "RepoLens Team" }]
dependencies = [
    "fastapi>=0.117.1",
    "uvicorn[standard]>=0.22.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "httpx>=0.27.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0"
]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.setuptools]
packages = ["app"]
py-modules = []

[tool.setuptools.package-data]
"*" = ["*.py"]

[tool.vercel]
entrypoint = "app.main:app"
